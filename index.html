<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canal Suporte TOTVS · Shippify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
/* ===== Tokens do Design System Shippify ===== */
:root{
  --brand-700:#FEDD29; --brand-500:#FFE669; --brand-300:#FFEF9E; --brand-200:#FFF5C2; --brand-100:#FFF8D6;
  --danger-600:#EF404C; --danger-100:#FFEBED;
  --success-800:#145C35; --success-500:#18A058; --success-100:#D1FAE5;
  --info-500:#3B82F6; --info-100:#EFF6FF;
  --warn-800:#92600A; --warn-500:#F59E0B; --warn-100:#FEF3C7;
  --g900:#212529; --g800:#343A40; --g700:#495057; --g500:#6C757D; --g400:#ADB5BD; --g300:#DEE2E6; --g200:#F2F2F2; --g100:#F8F9FA; --white:#FFFFFF;
  --bg:var(--g100); --surface:var(--white); --text:var(--g900); --text-2:var(--g500); --border:var(--g300);
  --chart-line:var(--g800); --chart-fill:rgba(254,221,41,.25); --chart-bar:var(--brand-700); --chart-grid:var(--g200); --chart-prev:var(--g400);
  --r-md:8px; --r-lg:12px; --r-full:9999px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#16191C; --surface:#212529; --text:#F8F9FA; --text-2:#ADB5BD; --border:#343A40;
  --chart-line:#F8F9FA; --chart-grid:#343A40; --chart-prev:#6C757D;
}}
:root[data-theme="dark"]{
  --bg:#16191C; --surface:#212529; --text:#F8F9FA; --text-2:#ADB5BD; --border:#343A40;
  --chart-line:#F8F9FA; --chart-grid:#343A40; --chart-prev:#6C757D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
img{max-width:100%}
.wrap{max-width:1440px;margin:0 auto;padding:24px}

/* Header */
.header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.logo{height:32px;display:block}
.logo-dark,.logo-icon{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .logo-light{display:none} :root:not([data-theme="light"]) .logo-dark{display:block} }
:root[data-theme="dark"] .logo-light{display:none} :root[data-theme="dark"] .logo-dark{display:block}
.titulo{flex:1;min-width:200px;border-left:1px solid var(--border);padding-left:16px}
.titulo h1{margin:0;font-size:20px;font-weight:600}
.titulo p{margin:0;color:var(--text-2);font-size:12px}
.acoes{display:flex;align-items:center;gap:12px}
.status{font-size:12px;color:var(--text-2);white-space:nowrap}
.btn{font-family:inherit;font-size:14px;font-weight:500;border-radius:var(--r-md);padding:8px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--g400)}
.btn-primary{background:var(--brand-700);border-color:var(--brand-700);color:var(--g900)}
.btn-primary:hover{background:var(--brand-500);border-color:var(--brand-500)}
.btn:disabled{opacity:.6;cursor:default}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Filtros */
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:24px}
.filtro{display:flex;flex-direction:column;gap:4px}
.filtro label{font-size:12px;color:var(--text-2);font-weight:500}
.filtro select,.filtro input{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);min-width:140px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:inherit;font-size:12px;font-weight:500;padding:8px 12px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.chip.ativo{background:var(--brand-700);border-color:var(--brand-700);color:var(--g900)}
.datas{display:none;gap:8px}
.datas.on{display:flex}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.kpi-titulo{font-size:12px;color:var(--text-2);font-weight:500;margin:0 0 4px}
.kpi-valor{font-size:28px;font-weight:600;margin:0;line-height:1.2}
.kpi-delta{font-size:12px;font-weight:500;margin:4px 0 0;display:flex;gap:4px;align-items:center}
.up-bom,.down-bom{color:var(--success-500)} .up-ruim,.down-ruim{color:var(--danger-600)} .neutro{color:var(--text-2)}
.spark{height:48px;position:relative}

/* Seções */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;margin-bottom:24px}
.secao-titulo{font-size:16px;font-weight:600;margin:0 0 16px}
.chart-box{position:relative;height:280px}
.insights{display:grid;gap:12px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-md);background:var(--g100);color:var(--g900)}
.insight.pos{background:var(--success-100)} .insight.neg{background:var(--danger-100)} .insight.alerta{background:var(--warn-100)}
.insight .dot{width:8px;height:8px;border-radius:var(--r-full);margin-top:6px;flex:none;background:var(--g500)}
.insight.pos .dot{background:var(--success-500)} .insight.neg .dot{background:var(--danger-600)} .insight.alerta .dot{background:var(--warn-500)}
.ia{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.ia-texto{white-space:pre-wrap;margin-top:12px;color:var(--text)}
.aviso{padding:16px;border-radius:var(--r-lg);margin-bottom:24px;border:1px solid var(--border);background:var(--surface)}
.aviso.erro{border-color:var(--danger-600);background:var(--danger-100);color:var(--g900)}
.vazio{color:var(--text-2);text-align:center;padding:48px 16px}
.full{grid-column:1/-1}
.tab-wrap{overflow-x:auto}
table.fila{width:100%;border-collapse:collapse;font-size:13px}
table.fila th{text-align:left;font-size:12px;font-weight:500;color:var(--text-2);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.fila td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.fila tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-full);background:var(--g200);color:var(--g900)}
.badge.alerta{background:var(--warn-100);color:var(--warn-800)} .badge.critico{background:var(--danger-100);color:var(--danger-600)}
.secao-sub{font-size:12px;color:var(--text-2);margin:-12px 0 16px}
.rodape{color:var(--text-2);font-size:12px;text-align:center;padding:24px 0}
.stale #kpis,.stale #graficos{opacity:.6}

@media (max-width:640px){
  .wrap{padding:16px}
  .logo-light,.logo-dark{display:none!important}
  .logo-icon{display:block;height:28px}
  .titulo{border-left:none;padding-left:0}
  .acoes{width:100%;justify-content:space-between}
}

/* ===== Visual navy (referência Smart Notification) ===== */
:root[data-theme="dark"]{
  --bg:#0A0F1C; --surface:#131A2B; --surface-2:#0F1524; --text:#F1F5F9; --text-2:#8B97AE; --border:#232D44;
  --chart-line:#FEDD29; --chart-grid:#1E2840; --chart-prev:#4B5873;
  --ok:#22C55E; --ok-bg:rgba(34,197,94,.14); --bad:#F43F5E; --bad-bg:rgba(244,63,94,.14); --att:#F59E0B; --att-bg:rgba(245,158,11,.14); --blue:#38BDF8; --blue-bg:rgba(56,189,248,.14);
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
body{background:var(--bg);letter-spacing:.1px}
.titulo h1{font-size:22px;font-weight:700}
.btn{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-primary{background:var(--brand-700);border-color:var(--brand-700);color:#0A0F1C;font-weight:600}
.btn-primary:hover{background:var(--brand-500);border-color:var(--brand-500)}
.info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1px solid var(--text-2);border-radius:50%;font-size:9px;font-weight:600;color:var(--text-2);cursor:help;margin-left:6px;vertical-align:middle;letter-spacing:0;text-transform:none}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--brand-700);border:1px solid rgba(254,221,41,.55);background:rgba(254,221,41,.08);border-radius:var(--r-full);padding:4px 12px;white-space:nowrap}
.tag:empty{display:none}

/* Banner de alertas */
.banner{border-radius:var(--r-lg);margin-bottom:16px;border:1px solid rgba(244,63,94,.45);background:linear-gradient(90deg,rgba(127,29,29,.55),rgba(120,72,10,.35))}
.banner.ok{border-color:rgba(34,197,94,.4);background:linear-gradient(90deg,rgba(20,83,45,.55),rgba(19,26,43,.6))}
.banner.atencao{border-color:rgba(245,158,11,.45);background:linear-gradient(90deg,rgba(120,72,10,.5),rgba(19,26,43,.6))}
.banner summary{list-style:none;cursor:pointer;display:flex;gap:16px;align-items:center;padding:16px 24px;font-size:15px}
.banner summary::-webkit-details-marker{display:none}
.banner summary b{font-weight:700;white-space:nowrap}
.banner summary .b-desc{color:#CBD5E1;flex:1}
.banner summary .seta{color:#CBD5E1;transition:transform .2s}
.banner[open] summary .seta{transform:rotate(180deg)}
.banner .b-lista{padding:0 24px 16px;display:grid;gap:8px}
.banner .b-item{display:flex;gap:12px;align-items:center;font-size:13px;color:#E2E8F0;flex-wrap:wrap}

/* Seções */
.secao{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
.sec-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#CBD5E1}
.sec-head p{margin:2px 0 0;font-size:13px;color:var(--text-2)}

/* Filtros */
.filtros{background:var(--surface-2);border-radius:16px}
.filtro label{text-transform:uppercase;letter-spacing:1px;font-size:11px;font-weight:600}
.filtro select,.filtro input{background:var(--surface);border-color:var(--border);color:var(--text)}
.chip{background:var(--surface);border-color:var(--border);color:var(--text)}
.chip.ativo{color:#0A0F1C;font-weight:600}

/* Cards e KPIs */
.card{background:var(--surface);border-color:var(--border)}
.kpis{margin-bottom:0}
.kpi{padding:20px}
.kpi-titulo{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:#CBD5E1;margin-bottom:8px}
.kpi-valor{font-size:32px;font-weight:700}
.kpi-sub{font-size:13px;color:var(--text-2);margin:4px 0 12px}
.kpi.critico{border-color:rgba(244,63,94,.55);border-left:3px solid var(--bad);background:linear-gradient(135deg,rgba(127,29,29,.35),var(--surface) 70%)}
.kpi.critico .kpi-valor{color:#FDA4AF}
.kpi.atencao{border-left:3px solid var(--att);background:linear-gradient(135deg,rgba(120,72,10,.3),var(--surface) 70%)}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:var(--r-full);border:1px solid transparent;white-space:nowrap}
.pill.verde{color:var(--ok);background:var(--ok-bg);border-color:rgba(34,197,94,.3)}
.pill.vermelho{color:var(--bad);background:var(--bad-bg);border-color:rgba(244,63,94,.35)}
.pill.amarelo{color:var(--att);background:var(--att-bg);border-color:rgba(245,158,11,.35)}
.pill.azul{color:var(--blue);background:var(--blue-bg);border-color:rgba(56,189,248,.3)}
.pill.cinza{color:var(--text-2);background:rgba(139,151,174,.12);border-color:var(--border)}
.pill.marca{color:var(--brand-700);background:rgba(254,221,41,.08);border-color:rgba(254,221,41,.45);text-transform:none;letter-spacing:0;font-weight:600}
.pill-nota{font-size:12px;color:var(--text-2)}

/* Cards de gráfico */
.grid{gap:24px}
.grid > .card{padding:20px}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.card-titulo{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:#CBD5E1}
.card-sub{margin:2px 0 0;font-size:12px;color:var(--text-2)}
.chart-box{height:300px}

/* Barras (estilo funil) */
.barras{display:grid;gap:12px}
.barra{display:grid;grid-template-columns:minmax(140px,250px) 1fr 64px;gap:16px;align-items:center;cursor:default}
.b-label{font-size:12px;font-weight:600;color:#CBD5E1;text-transform:uppercase;letter-spacing:.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-track{background:#1A2236;border-radius:8px;height:32px;overflow:hidden}
.b-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;animation:cresce .7s ease-out;min-width:40px}
.barra:hover .b-fill{filter:brightness(1.12)}
@keyframes cresce{from{width:0}}
.b-valor{font-size:14px;font-weight:700;text-align:right}
@media (max-width:640px){ .barra{grid-template-columns:1fr 56px} .b-label{grid-column:1/-1} }

/* Tabela da fila */
.full{grid-column:1/-1}
.tab-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface-2)}
table.fila{width:100%;border-collapse:collapse;font-size:14px}
table.fila th{text-align:left;font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
table.fila td{padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
table.fila td.forte{font-weight:600}
table.fila tr:last-child td{border-bottom:none}
table.fila th.dir,table.fila td.dir{text-align:right}

/* Insights */
.insights{gap:8px}
.insight{background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:3px solid var(--text-2)}
.insight.pos{background:var(--surface);border-left-color:var(--ok)}
.insight.neg{background:var(--surface);border-left-color:var(--bad)}
.insight.alerta{background:var(--surface);border-left-color:var(--att)}
.insight .dot{display:none}
.ia{border-top-color:var(--border)}
.aviso.erro{background:var(--bad-bg);border-color:rgba(244,63,94,.5);color:var(--text)}
.vazio{padding:32px 16px}
</style>
</head>

/* ===================== Utilidades de dados ===================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSRdts_uVJG6OO6o-LZiHYEd5qqSzAZn2kIdfwEziUULhs5Qrl1UeOVMM4L5XvZswDvf-KqvSGrIvop/pub?gid=1116152843&single=true&output=csv";
const $ = id => document.getElementById(id);
const DIA = 86400000;

function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,'');
  const l1=txt.split('\n')[0], sep=(l1.split(';').length>l1.split(',').length)?';':',';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c=='"'){ if(txt[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c=='"') q=true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c=='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!='\r') cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  const head=(rows.shift()||[]).map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v.trim()!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
function num(v){
  if(typeof v==='number') return v;
  if(v==null) return NaN;
  let s=String(v).replace(/R\$|%|\s/g,'');
  if(s==='') return NaN;
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  if(s.includes(',')&&(!s.includes('.')||s.lastIndexOf(',')>s.lastIndexOf('.'))) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/,/g,'');
  return parseFloat(s);
}
const MESES={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function data(v){
  if(!v) return null;
  let e=String(v).trim().toLowerCase().match(/^(\d{1,2})\s*[º°o]?\s+de\s+([a-zç]{3})[a-zç]*\.?,?\s+(\d{4})(?:\s+(\d{1,2})h(\d{1,2})?(?:min(\d{1,2}))?)?/);
  if(e&&MESES[e[2]]!=null) return new Date(+e[3],MESES[e[2]],+e[1],+(e[4]||0),+(e[5]||0),+(e[6]||0));
  let m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ const y=m[3].length==2?2000+ +m[3]:+m[3]; return new Date(y,m[2]-1,+m[1]); }
  m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],m[2]-1,+m[3]);
  return null;
}
const inicioDia = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fmtData = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
function fmt(v,f){
  if(v==null||isNaN(v)) return '–';
  if(f==='moeda') return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:v>=1000?0:2});
  if(f==='percentual') return v.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
  if(f==='decimal') return v.toLocaleString('pt-BR',{maximumFractionDigits:2});
  if(f==='dias') return v.toLocaleString('pt-BR',{maximumFractionDigits:1})+(Math.abs(v)>=0.95&&Math.abs(v)<1.05?' dia':' dias');
  return Math.round(v).toLocaleString('pt-BR');
}
function fmtEixo(v,f){
  const c=Math.abs(v)>=1000?v.toLocaleString('pt-BR',{notation:'compact',maximumFractionDigits:1}):v.toLocaleString('pt-BR',{maximumFractionDigits:1});
  return f==='moeda'?'R$ '+c:f==='percentual'?c+'%':f==='dias'?c+'d':c;
}
function agregar(linhas,k){
  switch(k.agregacao){
    case 'contagem': return linhas.length;
    case 'soma': return linhas.reduce((s,l)=>s+(num(l[k.coluna])||0),0);
    case 'media': { const v=linhas.map(l=>num(l[k.coluna])).filter(x=>!isNaN(x)); return v.length?v.reduce((a,b)=>a+b,0)/v.length:NaN; }
    case 'contagemSe': return linhas.filter(l=>k.condicao.valores.includes(l[k.condicao.coluna])).length;
    case 'idadeAbertas': { const ab=linhas.filter(l=>l.Status==='Em aberto'&&l._d); if(!ab.length) return NaN; const agora=Date.now(); return ab.reduce((s,l)=>s+(agora-l._d)/DIA,0)/ab.length; }
    case 'unicos': return new Set(linhas.map(l=>l[k.coluna]).filter(Boolean)).size;
    case 'taxa': { if(!linhas.length) return NaN; const ok=linhas.filter(l=>k.condicao.valores.includes(l[k.condicao.coluna])).length; return ok/linhas.length*100; }
  }
}

/* ===================== Estado ===================== */
let BASE=[], estado={periodo:CONFIG.periodoPadrao, ini:null, fim:null, filtros:{}}, charts=[], ultimoResumo=null;

function intervalo(){
  const hoje=inicioDia(new Date());
  let ini, fim=new Date(hoje.getTime()+DIA-1);
  switch(estado.periodo){
    case 'hoje': ini=hoje; break;
    case '7d': ini=new Date(hoje-6*DIA); break;
    case '30d': ini=new Date(hoje-29*DIA); break;
    case 'mes': ini=new Date(hoje.getFullYear(),hoje.getMonth(),1); break;
    case 'custom': ini=estado.ini?data(estado.ini):new Date(hoje-29*DIA); fim=estado.fim?new Date(data(estado.fim).getTime()+DIA-1):fim; break;
  }
  const dur=fim-ini+1;
  return {ini,fim,pIni:new Date(ini-dur),pFim:new Date(ini-1)};
}
function filtrar(){
  const r=intervalo();
  const base=BASE.filter(l=>Object.entries(estado.filtros).every(([c,v])=>!v||l[c]===v));
  const atual=base.filter(l=>l._d&&l._d>=r.ini&&l._d<=r.fim);
  const ant=base.filter(l=>l._d&&l._d>=r.pIni&&l._d<=r.pFim);
  return {r,atual,ant};
}
function serieDiaria(linhas,k,r){
  const dias=Math.round((r.fim-r.ini)/DIA)+1, passo=dias>62?7:1, labels=[], vals=[];
  for(let t=r.ini.getTime();t<=r.fim.getTime();t+=passo*DIA){
    const a=new Date(t), b=new Date(t+passo*DIA-1);
    labels.push(passo===7?'Sem. '+fmtData(a):fmtData(a));
    vals.push(agregar(linhas.filter(l=>l._d>=a&&l._d<=b),k));
  }
  return {labels,vals};
}

function renderInsights(res,n){
  const out=[];
  if(!n){ out.push({t:'Nenhum registro no período e filtros selecionados.',c:'alerta'}); }
  else{
    res.kpis.forEach(k=>{
      if(k.meta!=null&&!isNaN(k.valor)){
        const ok=k.melhorSeSobe?k.valor>=k.meta:k.valor<=k.meta;
        out.push({t:`${k.titulo} em ${fmt(k.valor,k.formato)} — ${ok?'dentro':'fora'} da meta de ${fmt(k.meta,k.formato)}.`,c:ok?'pos':'neg',p:ok?1:3});
      }
      if(!isNaN(k.delta)&&Math.abs(k.delta)>=(k.deltaEmPP?1:5)){
        const bom=(k.delta>0)===k.melhorSeSobe;
        out.push({t:`${k.titulo} ${k.delta>0?'subiu':'caiu'} ${Math.abs(k.delta).toLocaleString('pt-BR',{maximumFractionDigits:1})}${k.deltaEmPP?' p.p.':'%'} vs. período anterior (${fmt(k.anterior,k.formato)} → ${fmt(k.valor,k.formato)}).`,c:k.melhorSeSobe==null?'':(bom?'pos':'neg'),p:Math.abs(k.delta)>=(k.deltaEmPP?5:20)?3:2});
      }
    });
    res.rankings.forEach(rk=>{
      if(!rk.top.length) return;
      const [nome,v]=rk.top[0], somavel=['soma','contagem'].includes(rk.agregacao);
      const share=somavel&&rk.total?` (${(v/rk.total*100).toLocaleString('pt-BR',{maximumFractionDigits:0})}% do total)`:'';
      out.push({t:`${nome} lidera em ${rk.kpi.toLowerCase()} por ${rk.categoria.toLowerCase()}: ${fmt(v,rk.formato)}${share}.`,c:'',p:1});
      if(somavel&&rk.total&&v/rk.total>=.5) out.push({t:`Concentração alta: ${nome} responde por mais da metade de ${rk.kpi.toLowerCase()}.`,c:'alerta',p:2});
    });
    (res.picos||[]).forEach(pk=>out.push({t:`${pk.kpi}: pico em ${pk.maior[0]} (${fmt(pk.maior[1],pk.formato)}), menor valor em ${pk.menor[0]} (${fmt(pk.menor[1],pk.formato)}).`,c:'',p:0}));
  }
  const filaTotal=BASE.filter(l=>SEM_CONCLUSAO.includes(l.Status)&&Object.entries(estado.filtros).every(([c,v])=>!v||l[c]===v));
  if(filaTotal.length){
    const maisAntiga=filaTotal.reduce((a,b)=>a._d<b._d?a:b), dias=Math.floor((Date.now()-maisAntiga._d)/DIA);
    out.push({t:`Fila total (todas as datas): ${filaTotal.length} sem conclusão. A mais antiga está há ${dias} ${dias===1?'dia':'dias'} na fila (protocolo ${maisAntiga.Protocolo||'–'}, ${maisAntiga.Status.toLowerCase()}).`,c:dias>5?'neg':'alerta',p:4});
  } else if(BASE.length) out.push({t:'Nenhuma solicitação sem conclusão na fila (todas as datas).',c:'pos',p:4});
  out.sort((a,b)=>(b.p||0)-(a.p||0));
  const box=$('insights'); box.innerHTML='';
  out.slice(0,6).forEach(i=>{ const d=document.createElement('div'); d.className='insight '+(i.c||''); d.innerHTML='<span class="dot"></span><span></span>'; d.lastChild.textContent=i.t; box.appendChild(d); });
}

/* ===================== Limpeza e proteção de dados =====================
   A aba "Respostas do formulário" traz texto livre com dados pessoais.
   Aqui ficam só as colunas usadas no painel; Descrição, imagem e campo de
   novo perfil são descartados na leitura e nunca exibidos nem guardados. */
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function col(linha,...nomes){
  const chaves=Object.keys(linha);
  for(const n of nomes){ const alvo=norm(n), k=chaves.find(c=>norm(c)===alvo)||chaves.find(c=>norm(c).startsWith(alvo)); if(k) return linha[k]; }
  return '';
}
const limparMotivo=m=>String(m||'').split(/\s+-\s+@/)[0].trim();
function limpar(linhas){
  return linhas.map(l=>{
    const dh=col(l,'Data e hora','data_hora');
    if(!dh) return null;
    // Linhas de teste do formulário (envios do Diego no motivo Sugestões durante a implantação)
    if(norm(col(l,'Quem enviou','quem'))==='diegoalbuquerque' && norm(col(l,'Motivo de contato','motivo')).startsWith('sugestoes')) return null;
    const st=col(l,'Status','status').trim();
    return {
      'Data e hora':dh, _d:data(dh),
      Protocolo:col(l,'protocolo'),
      Motivo:limparMotivo(col(l,'Motivo de contato','motivo')),
      Departamento:col(l,'Departamento Solicitante','departamento').trim(),
      Solicitante:col(l,'Quem enviou','quem').trim(),
      Status:st||'Em aberto'
    };
  }).filter(Boolean);
}

let mcpNs=null, carregando=false;
function extrairCSV(res){
  // Ajuste após observar a resposta real do conector na conversa.
  const cands=[res.payload,res.structuredContent,...(res.content||[]).map(c=>c.text)];
  const achar=v=>{
    if(v==null) return null;
    if(typeof v==='string'){
      if(/[,;].*\n/.test(v)) return v;
      try{ const dec=decodeURIComponent(escape(atob(v.replace(/\s/g,'')))); if(/[,;].*\n/.test(dec)) return dec; }catch(_){}
      try{ return achar(JSON.parse(v)); }catch(_){ return null; }
    }
    if(typeof v==='object'){ for(const x of Object.values(v)){ const r=achar(x); if(r) return r; } }
    return null;
  };
  for(const c of cands){ const r=achar(c); if(r) return r; }
  throw {code:'formato',message:'Formato de resposta inesperado'};
}

// 1) Tenta a planilha ao vivo (link publicado da aba PAINEL).
// 2) Se o navegador bloquear, usa a cópia painel.csv salva pelo GitHub Actions.
async function baixarCSV(){
  const erros=[];
  try{
    const r=await fetch(CSV_URL,{cache:'no-store'});
    if(r.ok){ const t=await r.text(); if(/data_hora/i.test(t.split('\n')[0])) return {txt:t,fonte:'planilha'}; erros.push('planilha: resposta sem cabeçalho da PAINEL'); }
    else erros.push('planilha: HTTP '+r.status);
  }catch(e){ erros.push('planilha: '+(e.message||e)); }
  try{
    const r=await fetch('painel.csv?_t='+Date.now(),{cache:'no-store'});
    if(r.ok){ const t=await r.text(); if(/data_hora/i.test(t.split('\n')[0])){ const lm=r.headers.get('last-modified'); return {txt:t,fonte:'copia',quando:lm?new Date(lm):null,erros}; } erros.push('cópia: sem cabeçalho'); }
    else erros.push('cópia: HTTP '+r.status);
  }catch(e){ erros.push('cópia: '+(e.message||e)); }
  const err=new Error('rede'); err.detalhe=erros.join(' | '); throw err;
}
async function carregar(forcar){
  if(carregando) return; carregando=true;
  $('btnAtualizar').disabled=true; $('icoAtualizar').className='spin'; $('status').textContent='Atualizando…';
  try{
    const res=await baixarCSV();
    BASE=limpar(parseCSV(res.txt));
    const hm=d=>d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    if(res.fonte==='planilha'){
      $('status').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · direto da planilha';
      $('rodape').textContent=`${BASE.length.toLocaleString('pt-BR')} solicitações · Fonte: planilha ao vivo (o Google pode levar até 5 min para refletir uma alteração) · Shippify`;
    } else {
      $('status').textContent='Cópia de '+(res.quando?hm(res.quando):'–')+' · planilha indisponível';
      $('rodape').textContent=`${BASE.length.toLocaleString('pt-BR')} solicitações · Fonte: cópia salva pelo GitHub Actions · Detalhe: ${res.erros.join(' | ')} · Shippify`;
    }
    mostrarAviso(''); document.body.classList.remove('stale');
    montarFiltros(); render();
  }catch(e){
    if(BASE.length) document.body.classList.add('stale');
    mostrarAviso('Não foi possível carregar a planilha agora. Detalhe técnico: '+(e.detalhe||e.message),true);
    $('status').textContent=BASE.length?'Exibindo últimos dados':'Sem dados';
  }
  carregando=false; $('btnAtualizar').disabled=false; $('icoAtualizar').className='';
}

/* ===================== Filtros ===================== */
const PERIODOS=[['hoje','Hoje'],['7d','7 dias'],['30d','30 dias'],['mes','Mês atual'],['custom','Personalizado']];
function montarPeriodo(){
  const box=$('chipsPeriodo'); box.innerHTML='';
  PERIODOS.forEach(([v,l])=>{ const b=document.createElement('button'); b.className='chip'+(estado.periodo===v?' ativo':''); b.textContent=l;
    b.onclick=()=>{ estado.periodo=v; montarPeriodo(); $('datasCustom').classList.toggle('on',v==='custom'); render(); }; box.appendChild(b); });
}
function montarFiltros(){
  const box=$('filtrosDinamicos'); box.innerHTML='';
  CONFIG.filtros.slice(0,4).forEach(col=>{
    const vals=[...new Set(BASE.map(l=>l[col]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const w=document.createElement('div'); w.className='filtro';
    const id='f_'+col.replace(/\W/g,'_');
    w.innerHTML=`<label for="${id}"></label><select id="${id}"><option value="">Todos</option></select>`;
    w.querySelector('label').textContent=col;
    const s=w.querySelector('select');
    vals.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; s.appendChild(o); });
    s.value=estado.filtros[col]||'';
    s.onchange=()=>{ estado.filtros[col]=s.value; render(); };
    box.appendChild(w);
  });
}

/* ===================== Inicialização ===================== */
Chart.defaults.font.family=css('--font'); Chart.defaults.color=css('--text-2');
$('titulo').textContent=CONFIG.titulo; $('subtitulo').textContent=CONFIG.subtitulo;
montarPeriodo();
$('dtIni').onchange=e=>{ estado.ini=e.target.value; render(); };
$('dtFim').onchange=e=>{ estado.fim=e.target.value; render(); };
$('btnLimpar').onclick=()=>{ estado={periodo:CONFIG.periodoPadrao,ini:null,fim:null,filtros:{}}; $('dtIni').value=''; $('dtFim').value=''; $('datasCustom').classList.remove('on'); montarPeriodo(); montarFiltros(); render(); };
$('btnAtualizar').onclick=()=>carregar(true);
$('btnIA').onclick=gerarIA;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>BASE.length&&render());
render();

carregar(false);
setInterval(()=>{ if(!document.hidden) carregar(true); },10*60*1000);
</script>
